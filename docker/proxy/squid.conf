# Listen on the standard proxy port.
http_port 3128

# Domain allowlist. Lines beginning with '.' match the domain and any subdomain.
acl allowlist dstdomain "/etc/squid/allowlist.txt"

# We only permit HTTPS via CONNECT. Plain HTTP and arbitrary CONNECT ports are denied.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Allow only allowlisted destinations.
http_access allow allowlist
http_access deny all

# --- Sandbox-aware denial response ---------------------------------------
# Without this, a Squid block (allowlist miss) returns 403 - identical to
# what an origin server would return for its own access denial, leaving
# the agent unable to tell whether the destination refused it or whether
# it's being sandboxed by glovebox.
#
# 1. deny_info maps the catch-all denial to status 451 ("Unavailable For
#    Legal Reasons"), which real origins almost never return. Any agent
#    that sees `451` here can confidently classify it as a sandbox block.
# 2. reply_header_add attaches a structured header to every reply for a
#    non-allowlisted destination, giving programmatic clients a precise
#    reason and a remediation hint (`gbx allow <domain>` on the host).
#    Scoped via !allowlist so allowlisted (successful) replies stay clean.
deny_info 451:ERR_ACCESS_DENIED all
reply_header_add X-Glovebox-Egress "blocked; reason=domain-not-allowlisted; add-via='gbx allow <domain>'" !allowlist

# Don't cache HTTPS bodies. We're not here for caching.
cache deny all

# Log to a file we can tail with `docker exec`. ubuntu/squid runs as `proxy` user
# which already has write access to /var/log/squid.
access_log /var/log/squid/access.log squid

# Don't auto-rotate logs; they're transient anyway and rotation racing with
# our `docker exec ... tail` is annoying.
logfile_rotate 0

# Make the proxy itself less chatty so the access log stays readable.
debug_options ALL,1

# Surface "what domain was denied" clearly in the access log.
strip_query_terms off
